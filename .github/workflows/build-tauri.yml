name: Build Tauri

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        id: cargo-cache-restore
        with:
          path: |
            ~/.cargo/
            apps/web/src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: bun install

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          projectPath: './apps/web'

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: binaries-linux
          path: |
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/**/*.deb
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/**/*.rpm
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/**/*.AppImage

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin'
        with:
          name: binaries-macos-aarch64
          path: |
            ${{ github.workspace }}/apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin'
        with:
          name: binaries-macos-x86_64
          path: |
            ${{ github.workspace }}/apps/web/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: binaries-windows
          path: |
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/**/*.exe

      - name: Create cargo cache
        uses: actions/cache/save@v4
        id: cargo-cache-save
        if: steps.cargo-cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/
            apps/web/src-tauri/target/
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}
